name: ai_fitness_coach
description: Real-time squat coaching with ML Kit pose detection.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  google_mlkit_pose_detection: ^0.14.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.3.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true